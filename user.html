<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Test Ishlash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f12; color: #e8e8f0; min-height: 100vh; padding: 16px; }
h1 { text-align: center; margin-bottom: 20px; color: #6c63ff; }
.test-info { background: #1a1a22; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
.question { background: #1a1a22; padding: 20px; border-radius: 12px; margin-bottom: 16px; }
.q-number { font-size: 18px; font-weight: 700; color: #6c63ff; margin-bottom: 12px; }
.abcd { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.option { padding: 16px; background: #22222e; border: 2px solid #2e2e3e; border-radius: 10px; font-size: 17px; cursor: pointer; text-align: center; }
.option.selected { border-color: #6c63ff; background: rgba(108,99,255,0.2); }
.open-input { width: 100%; padding: 14px; background: #22222e; border: 2px solid #2e2e3e; border-radius: 10px; color: #e8e8f0; font-size: 16px; }
.btn { width: 100%; padding: 16px; margin-top: 20px; border: none; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #6c63ff; color: white; }
.progress { height: 6px; background: #2e2e3e; border-radius: 3px; margin: 20px 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #6c63ff, #a79fff); border-radius: 3px; }
</style>
</head>
<body>

<h1 id="test-nom">Test Yuklanmoqda...</h1>
<div class="test-info">
  <div>Kod: <b id="test-kod"></b></div>
  <div>Savol: <b id="current-q">1</b> / <b id="total-q">0</b></div>
</div>

<div id="questions-container"></div>

<div class="progress"><div class="progress-fill" id="progress-fill" style="width: 0%"></div></div>

<button class="btn btn-primary" id="btn-finish" style="display:none;">✅ Testni Yakunlash</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.BackButton.show();

let testKod = "";
let questions = [];
let userAnswers = {};
let currentQuestion = 1;

// URL dan kodni olish
function getQueryParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
}

async function loadTest() {
    testKod = getQueryParam('kod');
    if (!testKod) {
        tg.showAlert("Test kodi topilmadi!");
        return;
    }

    document.getElementById('test-kod').textContent = testKod;

    // TODO: Backenddan savollarni yuklash (hozircha test uchun)
    // Real loyihada fetch orqali savollarni olasan
    // Hozircha oddiy misol:
    tg.showAlert("Test yuklanmoqda... (Backend ulanmagan)");

    // Misol uchun statik test (keyin o'zgartiramiz)
    questions = [
        { raqam: 1, tur: "yopiq", savol: "2 + 2 nechaga teng?", variantlar: ["3", "4", "5", "6"], togri: "B" },
        { raqam: 2, tur: "ochiq", savol: "O'zbekiston poytaxti qayer?", togri: "Toshkent" }
    ];

    renderAllQuestions();
    document.getElementById('btn-finish').style.display = 'block';
}

function renderAllQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    questions.forEach((q, index) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        qDiv.innerHTML = `
            <div class="q-number">Savol ${q.raqam}</div>
            <div style="margin-bottom:12px; font-size:16px;">${q.savol}</div>
        `;

        if (q.tur === "yopiq") {
            const abcd = document.createElement('div');
            abcd.className = 'abcd';
            ['A','B','C','D'].forEach((letter, i) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = letter + ") " + q.variantlar[i];
                btn.onclick = () => selectAnswer(q.raqam, letter);
                if (userAnswers[q.raqam] === letter) btn.classList.add('selected');
                abcd.appendChild(btn);
            });
            qDiv.appendChild(abcd);
        } else {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'open-input';
            input.placeholder = 'Javobingizni yozing...';
            input.value = userAnswers[q.raqam] || '';
            input.onchange = (e) => userAnswers[q.raqam] = e.target.value.trim();
            qDiv.appendChild(input);
        }

        container.appendChild(qDiv);
    });

    updateProgress();
}

function selectAnswer(raqam, letter) {
    userAnswers[raqam] = letter;
    renderAllQuestions(); // refresh
}

function updateProgress() {
    const total = questions.length;
    const answered = Object.keys(userAnswers).length;
    const percent = total ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progress-fill').style.width = percent + '%';
    document.getElementById('current-q').textContent = answered;
    document.getElementById('total-q').textContent = total;
}

document.getElementById('btn-finish').addEventListener('click', () => {
    if (Object.keys(userAnswers).length < questions.length) {
        if (!confirm("Hamma savollarga javob bermadingiz. Baribir yakunlaysizmi?")) return;
    }

    const javoblar = [];
    questions.forEach(q => {
        javoblar.push({
            savol_raqam: q.raqam,
            javob: userAnswers[q.raqam] || ""
        });
    });

    const data = {
        test_kod: testKod,
        javoblar: javoblar
    };

    tg.sendData(JSON.stringify(data));
    tg.showAlert("✅ Javoblaringiz yuborildi!");
});

tg.BackButton.onClick(() => tg.close());

// Sahifa yuklanganda ishga tushirish
window.onload = loadTest;
</script>
</body>
</html>
