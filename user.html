<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Test Ishlash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f12; color: #e8e8f0; padding: 16px; }
    h1 { text-align: center; color: #6c63ff; margin-bottom: 20px; }
    .question { background: #1a1a22; padding: 20px; border-radius: 12px; margin-bottom: 16px; }
    .q-num { font-size: 18px; font-weight: bold; color: #6c63ff; margin-bottom: 10px; }
    .abcd { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .option { padding: 16px; background: #22222e; border: 2px solid #2e2e3e; border-radius: 10px; cursor: pointer; font-size: 16px; }
    .option.selected { border-color: #6c63ff; background: rgba(108,99,255,0.25); }
    .open-input { width: 100%; padding: 14px; background: #22222e; border: 2px solid #2e2e3e; border-radius: 10px; color: white; font-size: 16px; margin-top: 8px; }
    .btn { width: 100%; padding: 16px; background: #4ade80; color: black; border: none; border-radius: 12px; font-size: 17px; font-weight: 600; margin-top: 20px; }
</style>
</head>
<body>

<h1 id="test-nom">Test yuklanmoqda...</h1>
<div id="questions-container"></div>
<button id="finish-btn" class="btn" style="display: none;">✅ Testni Yakunlash va Yuborish</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.BackButton.show();

let testKod = "";
let questions = [];
let userAnswers = {};

// URL dan kodni olish
testKod = new URLSearchParams(window.location.search).get("kod");

async function loadTest() {
    if (!testKod) {
        tg.showAlert("Test kodi topilmadi!");
        return;
    }

    document.getElementById("test-nom").textContent = `Test: ${testKod}`;

    // Botga savollarni so'rash uchun xabar yuboramiz
    tg.sendData(JSON.stringify({
        action: "get_test_questions",
        kod: testKod
    }));

    tg.showAlert("Savollar yuklanmoqda...");
}

// Botdan kelgan ma'lumotni qabul qilish (aiogram WebAppData orqali emas, lekin hozircha oddiy usul)
function renderQuestions(qs) {
    questions = qs;
    const container = document.getElementById("questions-container");
    container.innerHTML = "";

    qs.forEach(q => {
        const div = document.createElement("div");
        div.className = "question";
        div.innerHTML = `<div class="q-num">Savol ${q.savol_raqam}</div><p>${q.savol_matni || q.savol}</p>`;

        if (q.tur === "yopiq") {
            const grid = document.createElement("div");
            grid.className = "abcd";
            ["A","B","C","D"].forEach(letter => {
                const opt = document.createElement("div");
                opt.className = "option";
                opt.textContent = `${letter}) ${q[`variant_${letter.toLowerCase()}`] || ''}`;
                opt.onclick = () => {
                    userAnswers[q.savol_raqam] = letter;
                    renderQuestions(qs); // refresh
                };
                if (userAnswers[q.savol_raqam] === letter) opt.classList.add("selected");
                grid.appendChild(opt);
            });
            div.appendChild(grid);
        } else {
            const input = document.createElement("input");
            input.type = "text";
            input.className = "open-input";
            input.placeholder = "Javobingizni yozing...";
            input.value = userAnswers[q.savol_raqam] || "";
            input.onchange = (e) => userAnswers[q.savol_raqam] = e.target.value.trim();
            div.appendChild(input);
        }
        container.appendChild(div);
    });

    document.getElementById("finish-btn").style.display = "block";
}

// Yakunlash tugmasi
document.getElementById("finish-btn").addEventListener("click", () => {
    const javoblar = Object.keys(userAnswers).map(key => ({
        savol_raqam: parseInt(key),
        javob: userAnswers[key]
    }));

    tg.sendData(JSON.stringify({
        test_kod: testKod,
        javoblar: javoblar
    }));

    tg.showAlert("✅ Javoblaringiz yuborildi! Natija hisoblanmoqda...");
});

tg.BackButton.onClick(() => tg.close());

// Sahifa yuklanganda
window.onload = loadTest;
</script>
</body>
</html>
