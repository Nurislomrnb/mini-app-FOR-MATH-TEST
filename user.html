<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Test Ishlash - User</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #0f0f12; color: #e8e8f0; min-height: 100vh; padding-bottom: 90px; }
        .topbar { background: #1a1a22; border-bottom: 1px solid #2e2e3e; padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
        .test-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .test-kod { font-family: monospace; font-size: 12px; color: #6c63ff; background: rgba(108,99,255,0.12); padding: 3px 8px; border-radius: 6px; }
        .progress { height: 4px; background: #2e2e3e; border-radius: 2px; }
        .progress-fill { height: 100%; background: #6c63ff; width: 0%; transition: 0.3s; }
        .dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
        .dot { width: 28px; height: 28px; border-radius: 6px; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1.5px solid #2e2e3e; background: #22222e; color: #888; }
        .dot.cur { border-color: #6c63ff; color: #6c63ff; }
        .dot.done { background: #6c63ff; border-color: #6c63ff; color: white; }
        .content { padding: 16px; }
        .q-card { background: #1a1a22; border: 1px solid #2e2e3e; border-radius: 14px; padding: 18px; min-height: 200px; }
        .q-text { font-size: 18px; font-weight: 500; margin-bottom: 20px; line-height: 1.4; color: #fff; }
        .abcd { display: grid; gap: 10px; }
        .abcd-btn { padding: 16px; border-radius: 12px; border: 2px solid #2e2e3e; background: #22222e; color: #e8e8f0; font-size: 16px; text-align: left; cursor: pointer; transition: 0.2s; }
        .abcd-btn.sel { border-color: #6c63ff; background: rgba(108,99,255,0.1); color: #a79fff; }
        .abcd-btn span { font-weight: bold; margin-right: 10px; color: #6c63ff; }
        input[type="text"] { width: 100%; padding: 15px; background: #22222e; border: 1.5px solid #2e2e3e; border-radius: 12px; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #6c63ff; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a22; border-top: 1px solid #2e2e3e; padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-prev { background: #2e2e3e; color: #888; }
        .btn-next { background: #6c63ff; color: white; }
        #loading { padding: 50px; text-align: center; color: #888; }
    </style>
</head>
<body>

<div id="loading">Savollar yuklanmoqda...</div>

<div id="main" style="display:none;">
    <div class="topbar">
        <div class="test-meta">
            <div id="t-nom" class="test-name">Test</div>
            <div id="t-kod" class="test-kod">0000</div>
        </div>
        <div class="progress"><div id="prog-fill" class="progress-fill"></div></div>
        <div id="dots-row" class="dots"></div>
    </div>

    <div class="content">
        <div class="q-card">
            <div id="q-text" class="q-text"></div>
            
            <div id="sec-y" class="abcd">
                <button class="abcd-btn" onclick="selectOpt('A')"><span>A</span> <span id="v-A"></span></button>
                <button class="abcd-btn" onclick="selectOpt('B')"><span>B</span> <span id="v-B"></span></button>
                <button class="abcd-btn" onclick="selectOpt('C')"><span>C</span> <span id="v-C"></span></button>
                <button class="abcd-btn" onclick="selectOpt('D')"><span>D</span> <span id="v-D"></span></button>
            </div>

            <div id="sec-o" style="display:none;">
                <input type="text" id="inp-o" placeholder="Javobingizni yozing..." oninput="saveOchiq()">
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="btn btn-prev" onclick="changeQ(-1)">← Oldingi</button>
        <button class="btn btn-next" id="btn-next" onclick="changeQ(1)">Keyingi →</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let questions = [];
    let answers = {}; // format: {1: "A", 2: "B"}
    let curIdx = 0;
    let testKod = "";

    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        const dataParam = params.get('data');

        if (dataParam) {
            try {
                const decoded = JSON.parse(decodeURIComponent(dataParam));
                questions = decoded.questions;
                testKod = decoded.test_kod || (decoded.test ? decoded.test.kod : "");
                
                document.getElementById('t-nom').textContent = decoded.test_nom || (decoded.test ? decoded.test.nom : "Test");
                document.getElementById('t-kod').textContent = testKod;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('main').style.display = 'block';
                renderQ();
            } catch (e) {
                document.getElementById('loading').textContent = "Xatolik: Ma'lumotni o'qib bo'lmadi.";
            }
        }
    };

    function renderQ() {
        const q = questions[curIdx];
        document.getElementById('q-text').innerHTML = `<b>${curIdx + 1}.</b> ${q.savol_matni}`;
        
        if (q.tur === 'yopiq') {
            document.getElementById('sec-y').style.display = 'grid';
            document.getElementById('sec-o').style.display = 'none';
            document.getElementById('v-A').textContent = q.variant_A;
            document.getElementById('v-B').textContent = q.variant_B;
            document.getElementById('v-C').textContent = q.variant_C;
            document.getElementById('v-D').textContent = q.variant_D;

            const btns = document.querySelectorAll('.abcd-btn');
            btns.forEach((b, i) => {
                const val = ['A', 'B', 'C', 'D'][i];
                b.classList.toggle('sel', answers[curIdx + 1] === val);
            });
        } else {
            document.getElementById('sec-y').style.display = 'none';
            document.getElementById('sec-o').style.display = 'block';
            document.getElementById('inp-o').value = answers[curIdx + 1] || '';
        }

        document.getElementById('btn-next').textContent = (curIdx === questions.length - 1) ? "Tugatish ✓" : "Keyingi →";
        renderDots();
        updateProgress();
    }

    function selectOpt(val) {
        answers[curIdx + 1] = val;
        renderQ();
        // Avtomatik keyingi savolga o'tish (ixtiyoriy)
        if (curIdx < questions.length - 1) {
            setTimeout(() => changeQ(1), 300);
        }
    }

    function saveOchiq() {
        answers[curIdx + 1] = document.getElementById('inp-o').value;
    }

    function changeQ(dir) {
        if (dir === 1 && curIdx === questions.length - 1) {
            finishTest();
            return;
        }
        const newIdx = curIdx + dir;
        if (newIdx >= 0 && newIdx < questions.length) {
            curIdx = newIdx;
            renderQ();
        }
    }

    function renderDots() {
        const row = document.getElementById('dots-row');
        row.innerHTML = '';
        questions.forEach((_, i) => {
            const d = document.createElement('div');
            d.className = `dot ${i === curIdx ? 'cur' : ''} ${answers[i+1] ? 'done' : ''}`;
            d.textContent = i + 1;
            d.onclick = () => { curIdx = i; renderQ(); };
            row.appendChild(d);
        });
    }

    function updateProgress() {
        const done = Object.keys(answers).length;
        document.getElementById('prog-fill').style.width = (done / questions.length * 100) + '%';
    }

    function finishTest() {
        if (confirm("Javoblarni yuborasizmi?")) {
            // MUHIM: Bot kutayotgan formatga o'tkazamiz
            // Bot answers: {"1": "A", "2": "B"} ko'rinishida kutmoqda
            const dataToSend = {
                test_kod: testKod,
                answers: answers 
            };
            tg.sendData(JSON.stringify(dataToSend));
        }
    }
</script>
</body>
</html>
